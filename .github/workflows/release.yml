name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install
          pnpm build

      - name: Copy frontend into backend/cmd/server/static
        run: |
          rm -rf backend/cmd/server/static
          cp -r frontend/build backend/cmd/server/static

      - name: Build Linux binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o stockpilot-linux-amd64 ./cmd/server/

      - name: Build Windows binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o stockpilot-windows-amd64.exe ./cmd/server/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            backend/stockpilot-linux-amd64
            backend/stockpilot-windows-amd64.exe

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stockpilot:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/stockpilot:latest
